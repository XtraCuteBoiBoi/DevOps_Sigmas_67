<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <!-- Google Font: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <script src="./js/jorell.js"></script>
    <script src="./js/weiye.js"></script>
    <script src="./js/jana.js"></script>
</head>

<body onload="viewTask()">
    <div class="page-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- TODO: jorell to implement website name/logo -->
            <div class="sidebar-header">
                <h2>SigTask Anchovy</h2> <!-- jorell you can change this if yw (NAME IT ANCHOVY) -->
            </div>

            <div class="sidebar-content">
                <!-- Create Task button: opens the pop-out form (jorell.js) -->
                <button type="button" id="createTaskBtn" class="create-task-btn" onclick="openCreateTaskModal()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Create Task
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Search Bar and Task Count -->
            <div class="top-bar">
                <!-- Search functionality is static, non-functional -->
                <input type="text" id="searchTask" class="search-input" placeholder="Search task name">
                <p class="total-tasks">Total Tasks (<span id="totalTasks">0</span>)</p>
            </div>


            <!-- Task Manager Container -->
            <section class="task-container">

                <!-- Task Manager Header -->
                <div class="task-header">
                    <div>
                        <h2>Task Manager</h2>
                        <p id="dateRange">Task Overview</p>
                    </div>

                    <!-- Sorting and Filtering Controls -->
                    <div class="task-controls">

                        <!-- Sorting Dropdown -->
                        <div class="control-group">
                            <label for="sortSelect">Sort By:</label>

                            <select id="sortSelect" onchange="sortTask()">
                                <option value="name-asc">Name (A-Z)</option>
                                <option value="name-desc">Name (Z-A)</option>
                                <option value="priority-asc">Priority (High-Low)</option>
                                <option value="priority-desc">Priority (Low-High)</option>
                                <option value="date-asc">Date (Earliest-Latest)</option>
                                <option value="date-desc">Date (Latest-Earliest)</option>
                            </select>
                        </div>

                        <!-- Filtering Dropdown -->
                        <div class="control-group">
                            <label for="filterSelect">Filter By:</label>
                            <select id="filterSelect">
                                <option value="all">All Tasks</option>
                                <option value="category">Category</option>
                                <option value="priority">Priority</option>
                                <option value="status">Status</option>
                                <option value="subject">Subject</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Task Table -->
                <div class="table-wrapper">
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th>ICON</th>
                                <th>NAME</th>
                                <th>CATEGORY</th>
                                <th>PRIORITY</th>
                                <th>STATUS</th>
                                <th>DUE DATE</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <!-- Task rows to be inserted using JavaScript -->
                        <tbody id="taskTableBody">

                            <!-- add delete button -jorell -->

                        </tbody>
                    </table>
                </div>

                <div id="noTaskTxt">
                    <span style="font-size: 1.2rem; display: flex; justify-content: center;">No task to display. Create
                        a task to display in here</span>
                </div>

            </section>

            <!-- Pagination -->
            <div class="pagination">
                <!-- prev page button -->
                <button id="previousPage" type="button" onclick="prevPage()">&lt;</button>
                <!-- show list index of total tasks -->
                <div id="paginationInfo">
                    <span>Showing
                        <span id="currentDisplayedValue">
                            0-0
                        </span>
                        <span>of</span>
                        <span id="totalTaskValue">
                            0
                        </span>
                        <span>tasks</span>
                    </span>
                </div>
                <!-- next page button -->
                <button id="nextPage" type="button" onclick="nextPage()">&gt;</button>

            </div>
        </main>
    </div>
    <!-- Create Task Pop-out (logic in js/jorell.js) -->
    <div id="createTaskOverlay" class="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createTaskTitle">
            <div class="modal-header">
                <div>
                    <h2 id="createTaskTitle">Create Task</h2>
                    <p>Fill in the details of your new task</p>
                </div>
                <!-- Close "X" button -->
                <button type="button" class="modal-close" aria-label="Close" onclick="closeCreateTaskModal()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6L18 18M18 6L6 18" stroke="#20352c" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <form id="createTaskForm" novalidate onsubmit="submitCreateTask(event)">
                <!-- General error (e.g. server not reachable) -->
                <p id="createTaskFormError" class="form-banner-error" hidden></p>

                <div class="form-grid">
                    <!-- Name -->
                    <div class="form-field full">
                        <label for="ctName">Name <span class="required">*</span></label>
                        <input type="text" id="ctName" maxlength="100" placeholder="Enter task name" autocomplete="off">
                        <span class="field-error" id="ctNameError"></span>
                    </div>

                    <!-- Category -->
                    <div class="form-field">
                        <label for="ctCategory">Category <span class="required">*</span></label>
                        <select id="ctCategory" onchange="toggleSubjectField()">
                            <option value="">Select category</option>
                            <option value="1">Personal</option>
                            <option value="2">Academic</option>
                            <option value="3">Work</option>
                            <option value="4">Errands</option>
                            <option value="5">Entertainment</option>
                        </select>
                        <span class="field-error" id="ctCategoryError"></span>
                    </div>

                    <!-- Priority -->
                    <div class="form-field">
                        <label for="ctPriority">Priority <span class="required">*</span></label>
                        <select id="ctPriority">
                            <option value="">Select priority</option>
                            <option value="1">High</option>
                            <option value="2">Medium</option>
                            <option value="3">Low</option>
                        </select>
                        <span class="field-error" id="ctPriorityError"></span>
                    </div>

                    <!-- Subject (only shown when category is Academic) -->
                    <div class="form-field full" id="ctSubjectField" hidden>
                        <label for="ctSubject">Subject <span class="required">*</span></label>
                        <select id="ctSubject">
                            <option value="">Select subject</option>
                            <option value="1">ITAD</option>
                            <option value="2">MLDP</option>
                            <option value="3">FWEB</option>
                            <option value="4">DVOPS</option>
                            <option value="5">CMATH</option>
                            <option value="6">PROCOMM</option>
                            <option value="7">GL</option>
                            <option value="8">SCA</option>
                        </select>
                        <span class="field-error" id="ctSubjectError"></span>
                    </div>

                    <!-- Status -->
                    <div class="form-field full">
                        <label for="ctStatus">Status <span class="required">*</span></label>
                        <select id="ctStatus">
                            <option value="">Select status</option>
                            <option value="1">Overdue</option>
                            <option value="2">Pending</option>
                            <option value="3">Completed</option>
                        </select>
                        <span class="field-error" id="ctStatusError"></span>
                    </div>

                    <!-- End date -->
                    <div class="form-field">
                        <label for="ctEndDate">End Date <span class="required">*</span></label>
                        <input type="date" id="ctEndDate">
                        <span class="field-error" id="ctEndDateError"></span>
                    </div>

                    <!-- End time -->
                    <div class="form-field">
                        <label for="ctEndTime">End Time <span class="required">*</span></label>
                        <input type="time" id="ctEndTime">
                        <span class="field-error" id="ctEndTimeError"></span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeCreateTaskModal()">Cancel</button>
                    <button type="submit" id="createTaskSubmit" class="btn-primary">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success message shown after a task is created -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
