<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <!-- Google Font: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <script src="./js/jorell.js"></script>
    <script src="./js/weiye.js"></script>
    <script src="./js/jana.js"></script>
</head>

<body onload="viewTask()">



    <div class="page-layout" id="content-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- TODO: jorell to implement website name/logo -->
            <div class="sidebar-header">
                <h2>Task Manager</h2> <!-- jorell you can change this if yw (NAME IT ANCHOVY) -->
            </div>

            <!-- TODO: jorell to implement Create Task button -->
            <div class="sidebar-content">
                <!-- Create Task button will be added here -->
            </div>
        </aside>

        <!-- Display error text when status code = 500 -->
        <div style="height: 50%; margin: auto; font-size: 1.25rem;">
            <span id="serverErrText"></span>
        </div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Search Bar and Task Count -->
            <div class="top-bar">
                <!-- Search functionality is static, non-functional -->
                <input type="text" id="searchTask" class="search-input" placeholder="Search task name">
                <p class="total-tasks">Total Tasks (<span id="totalTasks">0</span>)</p>
            </div>


            <!-- Task Manager Container -->
            <section class="task-container">

                <!-- Task Manager Header -->
                <div class="task-header">
                    <div>
                        <h2>Task Manager</h2>
                        <p id="dateRange">Task Overview</p>
                    </div>

                    <!-- Sorting and Filtering Controls -->
                    <div class="task-controls">

                        <!-- Sorting Dropdown -->
                        <div class="control-group">
                            <label for="sortSelect">Sort By:</label>

                            <select id="sortSelect" onchange="sortTask()">
                                <option value="name-asc">Name (A-Z)</option>
                                <option value="name-desc">Name (Z-A)</option>
                                <option value="priority-asc">Priority (High-Low)</option>
                                <option value="priority-desc">Priority (Low-High)</option>
                                <option value="date-asc">Date (Earliest-Latest)</option>
                                <option value="date-desc">Date (Latest-Earliest)</option>
                            </select>
                        </div>

                        <!-- Filtering Dropdown -->
                        <div class="control-group">
                            <label for="filterSelect">Filter By:</label>
                            <select id="filterSelect">
                                <option value="all">All Tasks</option>
                                <option value="category">Category</option>
                                <option value="priority">Priority</option>
                                <option value="status">Status</option>
                                <option value="subject">Subject</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Task Table -->
                <div class="table-wrapper">
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th>ICON</th>
                                <th>NAME</th>
                                <th>CATEGORY</th>
                                <th>PRIORITY</th>
                                <th>STATUS</th>
                                <th>DUE DATE</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <!-- Task rows to be inserted using JavaScript -->
                        <tbody id="taskTableBody">
                            
                            <!-- add delete button -jorell -->

                        </tbody>
                    </table>
                </div>
                                           
                <div id="noTaskTxtWrapper" >
                    <span id="noTaskTxt" style="font-size: 1.2rem; display: flex; justify-content: center;"></span>
                </div>

            </section>

            <!-- Pagination -->
            <div class="pagination">
                <!-- prev page button -->
                <button id="previousPage" type="button" onclick="prevPage()">&lt;</button>
                <!-- show list index of total tasks -->
                <div id="paginationInfo">
                    <span>Showing
                        <span id="currentDisplayedValue">
                            0-0
                        </span>
                        <span>of</span>
                        <span id="totalTaskValue">
                            0
                        </span>
                        <span>tasks</span> 
                    </span>
                </div>
                <!-- next page button -->
                <button id="nextPage" type="button" onclick="nextPage()">&gt;</button>

            </div>
        </main>
    </div>

    <!-- update modal -->
    <div class="modal-wrapper" id="edit-modal">
        <!-- header + close button -->
        <div class="modal-header">
            <!-- Headers -->
            <div class="modal-header-text">
                <span style="font-size: 32px; font-weight: 600;">Update Task</span>
            </div>
            <!-- Close btn -->
            <div style="position: absolute; right: 0px;">
                <button onclick="closeEditButton()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M5.29289 5.29289C5.68342 4.90237 6.31658 
                        4.90237 6.70711 5.29289L12 10.5858L17.2929 5.29289C17.6834 4.90237 18.3166 4.90237 18.7071 5.29289C19.0976 
                        5.68342 19.0976 6.31658 18.7071 6.70711L13.4142 12L18.7071 17.2929C19.0976 17.6834 19.0976 18.3166 18.7071 
                        18.7071C18.3166 19.0976 17.6834 19.0976 17.2929 18.7071L12 13.4142L6.70711 18.7071C6.31658 19.0976 5.68342 
                        19.0976 5.29289 18.7071C4.90237 18.3166 4.90237 17.6834 5.29289 17.2929L10.5858 12L5.29289 6.70711C4.90237 
                        6.31658 4.90237 5.68342 5.29289 5.29289Z" fill="#0F1729"/>
                    </svg>
                </button>
            </div>
        </div>
        <!-- input fields -->
        <div class="edit-input-container">
            <form id="editForm">
                <!-- name -->
                <div class="input-container">
                    <label for="editName">Name</label>
                    <input type="text" id="editName" placeholder="Enter Task Name">
                </div>
                <!-- category -->
                <div class="input-container">
                    <label for="editCategory">Category</label>
                    <select name="categoryId" id="editCategory" onchange="showSubjects()">
                        <option value="">Select Category</option>
                        <option value="1">Personal</option>
                        <option value="2">Academic</option>
                        <option value="3">Work</option>
                        <option value="4">Errands</option>
                        <option value="5">Entertainment</option>
                    </select>
                </div>
                <!-- subject -->
                <div class="input-container" id="subject-container">
                    <label for="editSubject">Subject</label>
                    <select name="subjectId" id="editSubject">
                        <option value="">Select Subject</option>
                        <option value="1">ITAD</option>
                        <option value="2">MLDP</option>
                        <option value="3">FWEB</option>
                        <option value="4">DVOPS</option>
                        <option value="5">CMATH</option>
                        <option value="6">PROCOMM</option>
                        <option value="7">GL</option>
                        <option value="8">SCA</option>
                    </select>
                </div>
                <!-- priority -->
                <div class="input-container">
                    <label for="editPriority">Priority</label>
                    <select name="priorityId" id="editPriority">
                        <option value="">Select Subject</option>
                        <option value="1">High</option>
                        <option value="2">Medium</option>
                        <option value="3">Low</option>
                    </select>
                </div>
                <!-- status -->
                <div class="input-container">
                    <label for="editStatus">Task Name</label>
                    <select name="statusId" id="editStatus">
                        <option value="">Select Subject</option>
                        <option value="1">Overdue</option>
                        <option value="2">Pending</option>
                        <option value="3">Completed</option>
                    </select>
                </div>
                <!-- end date -->
                <div class="input-container">
                    <label for="editEndDate">End Date</label>
                    <input type="date" id="editEndDate">
                </div>
                <!-- end time -->
                <div class="input-container">
                    <label for="editEndTime">End Time</label>
                    <input type="time" id="editEndTime">
                </div>

                <div style="margin-top: 6%; display: flex; justify-content: center;">
                    <button type="button" onclick="editTask()">
                        Update Task
                    </button>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
